trigger:
- main

# Use your existing self-hosted agent pool
pool:
  name: SelfHosted

variables:
  solution: 'LinkedInClone.sln'
  webProject: 'Web/Web.csproj'
  buildConfiguration: 'Release'
  azureSubscription: 'AzureSub'          # <-- your DevOps Service Connection name
  webAppName: 'wa-linkedin-clone-001'    # <-- your exact App Service name

steps:
- checkout: self
  clean: true

# Ensure the correct SDK is available on the agent
- task: UseDotNet@2
  displayName: 'Use .NET SDK 8.x'
  inputs:
    packageType: 'sdk'
    version: '8.x'

- script: dotnet --info
  displayName: Check .NET SDK

# Restore / Build
- script: dotnet restore $(solution)
  displayName: Restore

- script: dotnet build $(solution) --configuration $(buildConfiguration) --no-restore
  displayName: Build

# Remove this step if you don't have tests
- script: dotnet test --configuration $(buildConfiguration) --no-build
  displayName: Test

# Publish the Web project to a subfolder (cleaner for zipping/deploy)
- script: dotnet publish $(webProject) -c $(buildConfiguration) -o $(Build.ArtifactStagingDirectory)/web --no-build
  displayName: Publish

# Zip the published output (preferred for AzureWebApp task)
- task: ArchiveFiles@2
  displayName: 'Archive published site'
  inputs:
    rootFolderOrFile: '$(Build.ArtifactStagingDirectory)/web'
    includeRootFolder: false
    archiveType: zip
    archiveFile: '$(Build.ArtifactStagingDirectory)/web.zip'
    replaceExistingArchive: true

# Keep an artifact (optional, but handy)
- task: PublishBuildArtifacts@1
  displayName: 'Publish artifact'
  inputs:
    pathToPublish: '$(Build.ArtifactStagingDirectory)/web.zip'
    artifactName: 'drop'

# Deploy to Azure Web App (Linux)
- task: AzureWebApp@1
  displayName: 'Deploy to Azure Web App'
  inputs:
    azureSubscription: '$(azureSubscription)'
    appType: 'webAppLinux'
    appName: '$(webAppName)'
    package: '$(Build.ArtifactStagingDirectory)/web.zip'
