trigger:
  - main

# Use your existing self-hosted agent pool
pool:
  name: SelfHosted

variables:
  webProject: 'Web/Web.csproj'
  solution: 'LinkedInClone.sln'         # change if your .sln is named differently
  buildConfiguration: 'Release'
  azureSubscription: 'AzureSub'          # EXACT name of your DevOps Service Connection
  webAppName: 'wa-linkedin-clone-001'    # EXACT App Service name

steps:
# Ensure .NET 8 SDK is available
- task: UseDotNet@2
  displayName: 'Use .NET SDK 8.x'
  inputs:
    packageType: 'sdk'
    version: '8.x'

# Clean checkout
- checkout: self
  clean: true

# Restore / Build
- script: dotnet restore $(solution)
  displayName: Restore

- script: dotnet build $(solution) -c $(buildConfiguration) --no-restore
  displayName: Build

# If you don't have tests, you can remove this step
- script: dotnet test -c $(buildConfiguration) --no-build
  displayName: Test

# Publish the Web project to an output folder
- script: dotnet publish $(webProject) -c $(buildConfiguration) -o $(Build.ArtifactStagingDirectory)/web --no-build
  displayName: Publish

# Zip the published site for deployment
- task: ArchiveFiles@2
  displayName: 'Archive published site'
  inputs:
    rootFolderOrFile: '$(Build.ArtifactStagingDirectory)/web'
    includeRootFolder: false
    archiveType: zip
    archiveFile: '$(Build.ArtifactStagingDirectory)/web.zip'
    replaceExistingArchive: true

# (Optional) keep the artifact
- task: PublishBuildArtifacts@1
  displayName: 'Publish artifact'
  inputs:
    pathToPublish: '$(Build.ArtifactStagingDirectory)/web.zip'
    artifactName: 'drop'

# Deploy to Azure Web App (Linux)
- task: AzureWebApp@1
  displayName: 'Deploy to Azure Web App'
  inputs:
    azureSubscription: '$(azureSubscription)'
    appType: 'webAppLinux'
    appName: '$(webAppName)'
    package: '$(Build.ArtifactStagingDirectory)/web.zip'
